<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Llave y puerta</title>
<style>
:root{--tinta:#3f3560;--lila:#b9a8e8;--rosa:#f6a8c0;--rosaS:#d98aa5;--crema:#fff7f3;--rojo:#e8556f;
 --suelo:#fff7f3;--pared:#c9b6ee;--rastro:#ffd9e4;--acc:#f6a8c0;--c:56px;--ca:#ff7d96;--cb:#58a8f2}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{color:var(--tinta);font-family:"Avenir Next Rounded","Nunito","Trebuchet MS",sans-serif;overflow-x:hidden;
 background:radial-gradient(120% 80% at 15% 0%,#ffe3ec 0,transparent 55%),radial-gradient(100% 70% at 100% 100%,#e4dbff 0,transparent 55%),#fdf3ee}
h1,h2,h3{margin:0;font-family:"Baloo 2","Trebuchet MS",sans-serif;letter-spacing:.01em}
button{font:inherit;font-weight:700;color:var(--tinta);background:var(--acc);border:0;border-radius:14px;padding:9px 16px;cursor:pointer;box-shadow:0 3px 0 var(--rosaS);touch-action:manipulation}
button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--rosaS)}
button:focus-visible{outline:3px solid var(--tinta);outline-offset:2px}
button.pausaB{background:#7c66d1;color:#fff;box-shadow:0 4px 0 #5a47a8;font-size:1.02rem;padding:10px 16px;min-height:46px;border-radius:16px;animation:late 1.6s ease-in-out 3}
@keyframes late{50%{transform:scale(1.07)}}
#alm{position:fixed;left:8px;right:8px;top:8px;z-index:30;background:#ffe0e6;color:var(--tinta);border-radius:14px;padding:10px 14px;display:flex;gap:10px;align-items:center;font-weight:700;font-size:.9rem;box-shadow:0 3px 0 #e8a6b6}
#alm[hidden]{display:none}
#inv{background:#fff;border:2px solid var(--lila);border-radius:16px;padding:10px 14px;max-width:560px;text-align:center;font-size:.93rem;display:flex;flex-direction:column;gap:8px}
#inv[hidden]{display:none}
#inv button{padding:7px 12px;font-size:.88rem}
.fl{background:#fff1c9;border-radius:26%;margin:1px;color:#d9902b}.fl.r{background:var(--rastro)}
.po.dorm{background:#fff;color:var(--tinta);outline:3px dashed var(--h);outline-offset:1px;box-shadow:none;opacity:.6}
button.suave{background:#fff;box-shadow:0 3px 0 #e6d9ee}
button:disabled{opacity:.4;cursor:not-allowed}
.pant{display:none;min-height:100%;padding:max(14px,env(safe-area-inset-top)) 14px max(18px,env(safe-area-inset-bottom));flex-direction:column;align-items:center;gap:12px;animation:entra .35s ease-out}
.pant.on{display:flex}
@keyframes entra{from{opacity:0;transform:translateY(8px)}}
/* inicio */
#inicio{justify-content:center;text-align:center;gap:18px}
#inicio h1{font-size:clamp(2.6rem,11vw,4.6rem);line-height:.95;color:var(--tinta)}
#inicio h1 span{display:block;color:#e07a9e;transform:rotate(-2deg)}
#inicio p{max-width:34ch;margin:0;opacity:.8}
.logo{width:92px;height:92px;position:relative;animation:flota 3s ease-in-out infinite alternate}
@keyframes flota{to{transform:translateY(-8px) rotate(4deg)}}
.menuB{display:flex;flex-direction:column;gap:10px;min-width:220px}
.menuB button{font-size:1.1rem;padding:12px 18px}
/* selector */
.cab{display:flex;gap:10px;align-items:center;width:min(640px,100%);justify-content:space-between}
.cap{width:min(640px,100%);background:#ffffffb0;border-radius:22px;padding:14px;box-shadow:0 4px 0 #ecdcf0}
.cap h3{font-size:1.15rem}.cap small{opacity:.7}
.rej{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.nv{width:58px;height:62px;border-radius:14px;background:#fff;box-shadow:0 3px 0 #e6d9ee;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0}
.nv b{font-size:1.1rem}.nv i{font-style:normal;font-size:.7rem;letter-spacing:1px;color:#e0a000;min-height:1em}
.nv.ok{background:#e4f6e8;box-shadow:0 3px 0 #bddcc4}
/* juego */
#juego{gap:8px}
.hud{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.dato{background:#fff;border-radius:14px;padding:5px 12px;font-weight:700;box-shadow:0 2px 0 #ecdcd4;font-size:.92rem}
.dato.al{background:#ffe0e6;color:var(--rojo)}
#titulo{font-size:1.25rem;text-align:center}
#aviso{background:#fff;border-radius:16px;padding:8px 14px;max-width:560px;text-align:center;line-height:1.35;box-shadow:0 2px 0 #ecdcd4;font-size:.93rem}
#aviso:empty{display:none}
#msg{min-height:1.4em;font-weight:700;text-align:center;max-width:560px;font-size:.93rem}
#msg.mal{color:var(--rojo)}
#marco{position:relative;background:var(--pared);padding:8px;border-radius:24px;box-shadow:0 6px 0 rgba(0,0,0,.14),0 18px 30px -14px rgba(63,53,96,.45);touch-action:none}
#rej{position:relative;display:grid;border-radius:16px;overflow:hidden;background:var(--pared)}
.c{width:var(--c);height:var(--c);display:flex;align-items:center;justify-content:center;position:relative}
.c svg{width:70%;height:70%;fill:none;stroke:currentColor;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
.f{background:var(--suelo);border-radius:26%;margin:1px}
.f.r{background:var(--rastro)}
.f.r.kk{background:#d4ecd8}
.w{background:var(--pared);border-radius:26%;box-shadow:inset 0 -4px 0 rgba(0,0,0,.1)}
.hi{background:linear-gradient(135deg,#e6f6ff,#cfeaff 60%,#f4fbff);border-radius:26%;margin:1px;box-shadow:inset 0 0 0 2px #fff}
.hi::after{content:"";position:absolute;left:18%;top:14%;width:34%;height:6%;background:#fff;border-radius:9px;transform:rotate(-35deg);opacity:.9}
.hi.r{background:linear-gradient(135deg,#ffe3ee,#ffd0e0)}
.cr{background:repeating-linear-gradient(45deg,#9be3e0 0 6px,#c5f3f0 6px 12px);border-radius:26%;margin:1px;box-shadow:inset 0 0 0 2px #fff}
.cro{background:var(--suelo);border-radius:26%;margin:1px;outline:2px dashed #7fd3cf;outline-offset:-4px}
.kd{color:#e0a000}.ka{color:var(--ca)}.kb{color:var(--cb)}
.kd svg,.ka svg,.kb svg{animation:bota 1.4s ease-in-out infinite alternate}
@keyframes bota{to{transform:translateY(-3px) rotate(6deg)}}
.pu{color:#9b86d6}.pu.ab{color:#e0a000;animation:brilla 1s ease-in-out infinite alternate}
@keyframes brilla{from{transform:scale(.9)}to{transform:scale(1.1)}}
.ce{color:#8a77c4}
.ce.ca{color:var(--ca)}.ce.cb{color:var(--cb)}
.sw{color:#2aa59f}
.po{width:76%;height:76%;border-radius:50%;background:var(--tinta);color:#fff;box-shadow:0 0 0 calc(var(--c)*.06) var(--h);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:calc(var(--c)*.34)}
.po.vis{opacity:.35}
.sp{color:#c3b8d8}.sp.on{color:var(--rojo);background:#ffe0e6;border-radius:26%}.sp.av{outline:3px solid var(--rojo);outline-offset:-5px;border-radius:26%}
.sp small{position:absolute;right:4px;bottom:1px;font-size:calc(var(--c)*.26);font-weight:800}
#yo{position:absolute;left:8px;top:8px;width:var(--c);height:var(--c);pointer-events:none;z-index:3;transition:transform .11s ease-out}
#yo i{position:absolute;inset:13% 13% 9%;border-radius:48% 48% 42% 42%;background:#8cc4fa;box-shadow:inset 0 -5px 0 rgba(0,0,0,.13),0 3px 0 rgba(0,0,0,.12)}
#yo i::before,#yo i::after{content:"";position:absolute;top:34%;width:17%;height:21%;background:var(--tinta);border-radius:50%}
#yo i::before{left:24%}#yo i::after{right:24%}
#yo b{position:absolute;left:50%;top:60%;width:18%;height:9%;margin-left:-9%;border-bottom:3px solid var(--tinta);border-radius:0 0 12px 12px}
#yo.sacude i{animation:sac .25s}
@keyframes sac{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
#yo.pop i{animation:pop .3s}
@keyframes pop{50%{transform:scale(1.25)}}
#yo.tp i{animation:tp .35s}
@keyframes tp{0%{transform:scale(0) rotate(180deg)}100%{transform:none}}
#yo.gana i{animation:salta .5s infinite alternate}
@keyframes salta{to{transform:translateY(-10px) rotate(8deg)}}
#yo.cae i{animation:cae .5s forwards}
@keyframes cae{to{transform:scale(.2) rotate(120deg);opacity:0}}
.ctl{display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap}
.pad{display:grid;grid-template-columns:repeat(3,var(--pb));gap:8px;--pb:clamp(60px,19vw,84px)}
.pad button{height:var(--pb);padding:0;font-size:1.6rem;border-radius:20px}.pad .u{grid-column:2}.pad .e{grid-column:2}
.ex{display:flex;flex-direction:column;gap:8px}.ex button{min-height:44px}
/* capas */
#capa{position:fixed;inset:0;background:rgba(63,53,96,.5);display:none;align-items:center;justify-content:center;padding:18px;z-index:9;backdrop-filter:blur(2px)}
#capa.on{display:flex}
#caja{background:#fff;border-radius:26px;padding:24px 26px;max-width:380px;width:100%;text-align:center;display:flex;flex-direction:column;gap:10px;animation:entra .3s;max-height:90vh;overflow:auto}
#caja p{margin:0;line-height:1.4}
.est{font-size:2rem;letter-spacing:6px;color:#e0a000}
.est s{text-decoration:none;color:#e6dcef}
.fila{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
label.sw2{display:flex;gap:10px;align-items:center;justify-content:center;font-weight:700}
.conf{position:fixed;top:-10px;width:10px;height:14px;border-radius:3px;z-index:10;animation:cc 1.6s ease-in forwards;pointer-events:none}
@keyframes cc{to{transform:translateY(105vh) rotate(540deg);opacity:.8}}
pre{text-align:left;font-size:.75rem;background:#f5f0fb;border-radius:12px;padding:10px;max-height:40vh;overflow:auto;white-space:pre-wrap;margin:0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<section id="inicio" class="pant on">
  <svg class="logo" viewBox="0 0 24 24" style="fill:none;stroke:#e0a000;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round"><circle cx="8" cy="9" r="4.5" fill="#fff0b8"/><path d="M11.4 12.4L20 20m-3-3l2.2-2.2m-5-1l2-2"/></svg>
  <h1>Llave<span>y puerta</span></h1>
  <p>Recoge las llaves, no pises tu propio rastro y encuentra la salida.</p>
  <div class="menuB">
    <button id="bJugar">Continuar</button>
    <button id="bNiveles" class="suave">Capítulos</button>
    <button id="bDesafio" class="suave">Modo Desafío</button>
    <button id="bAjustes" class="suave">Ajustes</button>
    <button id="bCreditos" class="suave">Créditos</button>
  </div>
</section>

<section id="selector" class="pant">
  <div class="cab"><button id="sVolver" class="suave">‹ Inicio</button><h2 id="sTit">Capítulos</h2><span id="sTotal" class="dato"></span></div>
  <div id="caps"></div>
</section>

<section id="juego" class="pant">
  <div class="cab"><button id="gMenu" class="pausaB" aria-label="Pausar el juego" title="Pausar (Esc o P)">⏸ Pausar</button><h2 id="titulo"></h2><span id="gCap" class="dato"></span></div>
  <div class="hud"><span class="dato" id="dPasos"></span><span class="dato" id="dLlaves"></span><span class="dato" id="dTiempo">0:00</span><span class="dato" id="dPar"></span></div>
  <div id="aviso"></div><div id="msg"></div><div id="inv" hidden></div>
  <div id="marco"><div id="rej"></div><div id="yo"><i></i><b></b></div></div>
  <div class="ctl">
    <div class="pad"><button class="u" data-a="U" aria-label="Arriba">▲</button><button data-a="L" aria-label="Izquierda">◀</button><button data-a="D" aria-label="Abajo">▼</button><button data-a="R" aria-label="Derecha">▶</button></div>
    <div class="ex"><button id="bUndo">Deshacer (Z)</button><button id="bPista" class="suave" hidden>💡 Pista</button><button id="bEsp" class="suave">Esperar (Espacio)</button><button id="bRei" class="suave">Reiniciar (R)</button><button id="bSol" class="suave" hidden>Solución (dev)</button></div>
  </div>
</section>

<div id="alm" hidden><span>⚠️ El guardado no está disponible en este navegador (modo privado o almacenamiento bloqueado): tu progreso se perderá al cerrar la página.</span><button id="almX" class="suave">OK</button></div>
<div id="capa"><div id="caja"></div></div>
<script id="core">

 Leyenda: # muro · S inicio · D puerta · k llave dorada (obligatoria) · a/b llaves coral/azul · A/B cerraduras
 I hielo · * interruptor · M cristal cerrado (se abre) · N cristal abierto (se cierra) · 1 2 3 portales (pares)
 p pincho (2 seguros/2 activos) · q pincho lento (3/3). s = pasos de holgura sobre el óptimo; par y sol = longitud óptima y solución de referencia (verificadas por las pruebas). */
const CAPS=[
 {n:'Jardín',sub:'Llave, puerta y rastro',suelo:'#fff7f3',pared:'#c9b6ee',rastro:'#ffd9e4'},
 {n:'Espinas y engaños',sub:'Portales y pinchos',suelo:'#fff4f8',pared:'#e5a6c3',rastro:'#ffd2e0'},
 {n:'Cerraduras',sub:'Llaves de color que se gastan',suelo:'#fffaf0',pared:'#f0c98a',rastro:'#ffe3c4'},
 {n:'Hielo',sub:'Deslizarse sin frenar',suelo:'#f6fbff',pared:'#9ccbf0',rastro:'#d6ecff'},
 {n:'Cristal',sub:'Mecanismos y combinaciones',suelo:'#f5fffd',pared:'#8fd6cf',rastro:'#cdf3ee'}
];
const LV=[
 {c:0,t:'Primer paseo',s:4,par:5,sol:'DDLLL',h:'Muévete con flechas, WASD o los botones. Recoge la llave dorada y entra por la puerta: sin llave no se abre.',r:['.....','#..S.','....#','D..k.','...#.']},
 {c:0,t:'Tres llaves',s:4,par:8,sol:'DDRRURDR',h:'Tu camino se tiñe de rosa y no puedes pisarlo otra vez; chocar con él cuenta como esperar un paso. Hay tres llaves: el orden de visita importa.',r:['.S...#','...kk.','#..k.D','##....','##.#..']},
 {c:0,t:'Rodeo',s:4,par:7,sol:'DRDRURU',h:'Antes de moverte, traza la ruta completa: cada casilla que pisas deja de estar disponible para volver.',r:['...###','##.###','##S.#D','#.....','..#.k.']},
 {c:0,t:'El camino largo',s:4,par:6,sol:'RDDRRD',h:'Una ruta que parece buena puede dejarte sin salida. Deshacer es gratis: úsalo para probar ideas.',r:['..##..','#..##.','##....','##S..#','.##k#.','.#....','....#D']},
 {c:0,t:'Pasos contados',s:4,par:9,sol:'DDRDLLLLL',h:'Cuenta los pasos que te quedan antes de comprometerte con un rodeo.',r:['......','...#S.','.#....','......','D....k','..##..','#.#...']},
 {c:0,t:'Dos llaves',s:4,par:10,sol:'RRRDLDRDDR',h:'Con dos llaves, elige primero la que te deje un camino de vuelta hacia la puerta.',r:['S...#','...k#','.#k.#','.##..','.#..D','.....','..#.#']},
 {c:1,t:'Atajo dudoso',s:3,par:10,sol:'RDLLLULUUU',h:'Un portal te lleva a su pareja (mismo color y letra) y ambos extremos quedan en tu rastro. Entrar en el momento equivocado puede dejarte sin salida.',r:['...##D.','.#..#..','1#...1.','..#S.#.','....k.#']},
 {c:1,t:'Pausa en las espinas',s:3,par:10,sol:'UUWLUULLLD',h:'Los pinchos alternan: el número indica cuántos pasos faltan para que cambien, y un borde rojo avisa de que se activarán en el próximo paso. Espacio espera un paso.',r:['#.#..#','..p.k.','.D1..#','...#p1','..S..#']},
 {c:1,t:'Portal sin retorno',s:3,par:13,sol:'LUULDDLDDDDRR',h:'Mira qué casillas dejas atrás al cruzar un portal: ya no podrás volver por ellas.',r:['k...1#.','..#.p..','1.S..#.','....#..','..#..D.']},
 {c:1,t:'Ritmo de pinchos',s:3,par:9,sol:'RDWLLLULU',h:'Aquí el reto es el ritmo: cada pincho tiene su propio ciclo, y esperar en el sitio correcto importa.',r:['....#','.S...','D#1#q','..#..','qkpp1']},
 {c:1,t:'Entrar a tiempo',s:3,par:12,sol:'UDUUDDRDLLUL',h:'Entrar al portal antes de tiempo puede cerrarte la solución: decide cuándo.',r:['...1p','..1S#','##.p.','...##','D..k.','#..p.']},
 {c:1,t:'Esperar con el rastro',s:3,par:15,sol:'DUURDRDRDRRUUUU',h:'Chocar con tu propio rastro cuenta como esperar un paso: a veces es útil. Y los portales siguen castigando la prisa.',r:['...p#D','.1.##.','#k.#..','S#..2q','.1#...','.2.#q.']},
 {c:2,t:'Una cerradura',s:3,par:14,sol:'URDDDDRRRUUULL',h:'Una llave de color solo abre su cerradura (mismo color) y se gasta al usarla. La puerta sigue pidiendo todas las llaves doradas.',r:['.k.#.','S.Dk.','...#.','#..#.','.aA..']},
 {c:2,t:'Gastar la llave',s:3,par:15,sol:'LDDDDDDLUULUUUU',h:'Abrir una cerradura gasta la llave: hacerlo en el momento equivocado puede dejarte sin salida.',r:['D.aS.','.#.A#','k#...','.#..#','A..##','....#','#.k##']},
 {c:2,t:'Dos colores',s:3,par:15,sol:'RRUULUUULLDDDRD',h:'Dos colores: cada llave abre solo su cerradura. Decide qué cerradura abres antes de gastar la llave.',r:['.#..#','.b...','k#.#.','...#B','B....','#D...','.S.k.']},
 {c:2,t:'Orden de recogida',s:3,par:17,sol:'RURRRRUULLLLLDRRR',h:'Recoger una llave de color demasiado pronto puede cerrarte el camino: piensa qué casillas necesitas para volver.',r:['.#.A.#A','......a','.kB.D.k','#B....b','#S..#.#']},
 {c:2,t:'Camino de regreso',s:3,par:16,sol:'RRDDDLLLDRDRRURU',h:'Tu rastro es el obstáculo: reserva el camino de regreso a la puerta.',r:['.#.#.','.S...','B##.#','.##..','..abD','k....','#.Ak#']},
 {c:2,t:'Desde la puerta',s:3,par:18,sol:'RRDLLLULDLDDDRRRUU',h:'Empieza pensando desde la puerta hacia atrás.',r:['#..#..#','#b.S.k#','.B.....','.#.D#..','..#..#.','...k.#.']},
 {c:3,t:'Primer resbalón',s:3,par:14,sol:'DDDDRDLLUUUUUL',h:'En el hielo te deslizas hasta que un muro, el borde o tu rastro te frenan. Cada casilla que cruzas queda marcada. Deslizarte donde no debes puede cerrarte el camino.',r:['.DIS#I','.....I','.#.k#.','#I....','II...I','.I..k#']},
 {c:3,t:'Tres deslizamientos',s:3,par:13,sol:'RRRUUUULDDLUR',h:'Calcula dónde terminas antes de empujarte: los deslizamientos ocupan casillas que luego necesitarás.',r:['I..k.#','###...','#.DI..','I.II.#','.S..kI']},
 {c:3,t:'Rastro de hielo',s:3,par:16,sol:'RRURURDDLDLLLDDL',h:'Un deslizamiento largo marca muchas casillas de golpe. ¿Te dejará pasar después?',r:['.#..II#','I..k#..','S.k#..I','.....#.','#.#..#.','DI#....']},
 {c:3,t:'Frenar con el rastro',s:3,par:14,sol:'DRDRRUURUULLLD',h:'Si no hay muro para frenarte, tu propio rastro puede hacerlo.',r:['....I','#D#..','S.#.k','..I.I','I..k#','.III.']},
 {c:3,t:'Hielo y cerradura',s:3,par:19,sol:'DDDDDLLLLURUUURRDDD',h:'Hielo y cerradura: un deslizamiento no se puede detener a mitad de camino.',r:['.I...S#','#k#...#','...I#..','#I.A..A','..#D#..','k.I.a..','#.#.I.#']},
 {c:3,t:'Deslizar y abrir',s:3,par:19,sol:'DRDDLULULULLDRDDRDL',h:'Abrir la cerradura en mal momento o deslizarte donde no debes: ambas decisiones pueden ser irreversibles.',r:['.B..S.','kI....','#.#...','#I#Bbk','I.I..#','.#D.II']},
 {c:4,t:'El interruptor',s:2,par:15,sol:'DLDLDDLULULUURR',h:'Pisar el interruptor abre los cristales rellenos (M) y cierra los vacíos (N). Pisado en mal momento, puede dejarte sin salida.',r:['.....#.#','..#.#..#','...D##S.','..N.....','*.M#.*#.','.M..kN.#','..#.k.##','....#..#']},
 {c:4,t:'Cristales y hielo',s:2,par:22,sol:'DRDDLLDLUURUULUURDRRRU',h:'El deslizamiento puede cruzar un interruptor y cambiar el tablero a mitad de camino.',r:['...#D#','I..*N#','.##IS.','M.##II','#*M#.k','..##..','N.II..','.k.#.N']},

  for(let x=0;x<n;x++){let ch=row[x];const i=y*n+x;if(ch==='S'){st=i;ch='.'}if(ch==='k')nk++;
   if('12345'.includes(ch))(pt[ch]=pt[ch]||[]).push(i);g.push(ch)}});

const init=lv=>{const vis=new Uint8Array(lv.n*lv.m);vis[lv.st]=1;return {p:lv.st,t:0,vis,inv:0,kk:0,sw:0}};

const solido=(lv,s,i)=>{const c=lv.g[i];return c==='#'||(c==='M'&&!s.sw)||(c==='N'&&s.sw)};

   const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=lv.n||ny>=lv.m){if(primero)return{err:'muro'};break}
   const i=ny*lv.n+nx,c=lv.g[i];
   if(solido(lv,q,i)){if(primero)return{err:'muro'};break}
   if(q.vis[i]){if(primero){q.t++;ev.push(['rastro'])}break}
   if(c==='D'&&q.kk<lv.nk){if(primero)return{err:'puerta',falta:lv.nk-q.kk};break}
   if(c==='A'||c==='B'){const b=BITS[c];if(!(q.inv&b)){if(primero)return{err:'cerradura',c};break}q.inv&=~b;ev.push(['abre',c])}
   x=nx;y=ny;q.p=i;q.vis[i]=1;primero=false;mov=true;
   if(c==='k'){q.kk++;ev.push(['llave'])}
   else if(c==='a'||c==='b'){q.inv|=BITS[c];ev.push(['llaveC',c])}
   else if(c==='*'){q.sw^=1;ev.push(['inter'])}
   else if(ARR[c]){[dx,dy]=ARR[c];ev.push(['flecha'])}
   else if(lv.link[i]!==undefined&&!q.vis[lv.link[i]]&&(!DORM[c]||q.sw)){q.p=lv.link[i];q.vis[q.p]=1;ev.push(['portal',i,q.p]);break}
   if(c==='D')break;
   if(c!=='I'&&!ARR[c])break;

function solve(lv,from,cap){

 CH.forEach((d,i)=>{const N='Desafío '+(i+1);let lv;try{lv=parse(d)}catch(e){T(N+' carga',false,e.message);return}

  const a=q.path[0];return 'Prueba esto como siguiente movimiento: '+({U:'▲ arriba',D:'▼ abajo',L:'◀ izquierda',R:'▶ derecha',W:'esperar un paso (Espacio)'})[a]+'.'}catch(e){return 'No pude calcular la pista.'}}
function mostrar(m,n,conc){
 if(m==='incierto')m=PRIO.find(x=>mecs(DEF()).includes(x))||'ruta';
 const t=TX[m];let cuerpo=conc?`${t[0]}</p><p>${t[1]}`:n===1?t[0]:n===2?t[1]:siguiente();
 caja(`<h2>${ETQ[m]}</h2><p>${cuerpo}</p><div class="fila">${!conc&&n<3?'<button id="m1">Más ayuda</button>':''}<button class="suave" id="m2">Otro tema</button><button class="suave" id="m3">Cerrar</button></div>`,c=>{
  if(c.querySelector('#m1'))c.querySelector('#m1').onclick=()=>mostrar(m,n+1,conc);c.querySelector('#m2').onclick=()=>categorias(conc);c.querySelector('#m3').onclick=seguir})}
/* ---- controles ---- */
const KEYS={ArrowUp:'U',ArrowDown:'D',ArrowLeft:'L',ArrowRight:'R',w:'U',s:'D',a:'L',d:'R'};
addEventListener('keydown',e=>{if(!$('juego').classList.contains('on')||e.ctrlKey||e.metaKey)return;
 const k=e.key.length===1?e.key.toLowerCase():e.key;
 if(k==='Escape'||k==='p'){e.preventDefault();enPausa?seguir():pausa();return}
 if(KEYS[k]){e.preventDefault();act(KEYS[k])}else if(k===' '){e.preventDefault();act('W')}
 else if(k==='z'||k==='Backspace'){e.preventDefault();deshacer()}else if(k==='r'&&!enPausa)reiniciar()});
document.querySelectorAll('.pad button').forEach(b=>b.onclick=()=>act(b.dataset.a));
let tx,ty;const M=$('marco');
M.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
M.addEventListener('touchend',e=>{const t=e.changedTouches[0],dx=t.clientX-tx,dy=t.clientY-ty;if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;
 act(Math.abs(dx)>Math.abs(dy)?(dx>0?'R':'L'):(dy>0?'D':'U'))},{passive:true});
$('bUndo').onclick=deshacer;$('bEsp').onclick=()=>act('W');$('bRei').onclick=reiniciar;$('gMenu').onclick=()=>pausa();$('bPista').onclick=()=>{if(!bloq&&!enPausa)quierePista()};
$('bJugar').onclick=()=>{const u=PA.ult&&PA[PA.ult];if(u&&u.a!==undefined&&(u.m==='c'||u.m==='d')){MODO=u.m;return cargar(u.i)}
 MODO='c';let i=0;while(i<LV.length-1&&SV.done[i])i++;cargar(i)};
$('bNiveles').onclick=()=>listar('c');$('bDesafio').onclick=entraDesafio;$('sVolver').onclick=()=>pantalla('inicio');$('bAjustes').onclick=()=>ajustes();$('bCreditos').onclick=creditos;
$('bDesafio').textContent=(DEV||campDone())?'⭐ Modo Desafío':'🔒 Modo Desafío';
$('almX').onclick=()=>$('alm').hidden=true;if(!ALM)avisoALM();
$('capa').addEventListener('click',e=>{if(e.target.id==='capa'&&$('juego').classList.contains('on')&&!bloq)$('capa').classList.remove('on')});
addEventListener('resize',()=>{if(lv&&$('juego').classList.contains('on'))ajustar()});
/* guarda y pausa al salir, apagar pantalla o cambiar de pestaña */
document.addEventListener('visibilitychange',()=>{if(document.hidden&&lv&&$('juego').classList.contains('on')){if(!$('capa').classList.contains('on'))pausa('Pausa automática');else{freezeT();guardaP()}}});
addEventListener('pagehide',()=>{if(lv&&$('juego').classList.contains('on')){freezeT();guardaP()}});


if(DEV){
 $('bSol').hidden=false;
 $('bSol').onclick=async()=>{const q=!A.length&&DEF().sol?{path:DEF().sol}:solve(lv,S,300000);if(!q.path){say('Sin solución desde aquí',1);return}
  for(const a of q.path){act(a);await new Promise(r=>setTimeout(r,260))}};
 const b=document.createElement('button');b.textContent='Probar todo (dev)';b.className='suave';b.style.cssText='position:fixed;right:8px;bottom:8px;z-index:5';
 b.onclick=()=>{const r=runTests(),mal=r.filter(x=>!x.ok);console.table(r);
  caja(`<h2>Pruebas</h2><p>${r.length-mal.length}/${r.length} correctas</p><pre>${r.map(x=>(x.ok?'OK  ':'FALLA ')+x.n+(x.x?' — '+x.x:'')).join('\n')}</pre><button id="x1">Cerrar</button>`,c=>c.querySelector('#x1').onclick=()=>$('capa').classList.remove('on'))};
 document.body.appendChild(b);window.LLP={LV,CH,nivel,solve,step,init,vivos,runTests};
}
}
